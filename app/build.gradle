plugins {
    id 'com.android.application'
}
android {
    namespace 'com.macos.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.macos.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        feng {
            storeFile file('../signing/feng-release.keystore')
            storePassword '39495062ded632f1ebcefb5c'
            keyAlias 'feng'
            keyPassword '39495062ded632f1ebcefb5c'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.feng }
        debug { signingConfig signingConfigs.feng }
    }
    androidResources { noCompress 'ttf' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.3.1'
    implementation 'androidx.media3:media3-effect:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'com.google.guava:guava:32.1.3-android'
}
